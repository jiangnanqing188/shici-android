# 拾词官网：仅 HTTP 80 的纯静态站点配置。
# 由 website/deploy/install.sh 安装为 /etc/nginx/sites-available/shici-website，
# 并只通过 /etc/nginx/sites-enabled/shici-website 启用。
# 本配置不监听 443，不代理任何其他服务；仅服务官网白名单内的静态资源。

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /srv/shici-website/www;
    index index.html;

    # 不提供目录列表，不允许读取白名单以外的路径。
    autoindex off;
    # 对白名单内的三种 MIME 显式附加 charset=utf-8，不改写各自的 Content-Type。
    charset utf-8;
    charset_types text/html text/css application/javascript;
    server_tokens off;

    # 本服务器官网静态资源显式给出基础 Content-Type。
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 只接受 GET/HEAD，其余方法返回 405。
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # 官网公开范围：首页、三个独立二级页、三份共享资源（精确匹配）。其余 GET/HEAD
    # 路径（含旧 APK）统一 404；不开目录列表、不做 SPA fallback、不代理网络服务。
    # README、部署脚本与仓库文件均不在白名单内。
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # 独立二级页面：每页一个精确 location，不引入目录级或前缀匹配。
    location = /features.html {
        try_files $uri =404;
    }

    location = /guide.html {
        try_files $uri =404;
    }

    location = /download.html {
        try_files $uri =404;
    }

    location = /styles.css {
        try_files $uri =404;
    }

    location = /content.js {
        try_files $uri =404;
    }

    location = /app.js {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
